  <style>
    body {
      margin: 0;

      background-image: url(https://news.northeastern.edu/wp-content/uploads/2018/08/KingHuskyHead.jpg);

    }

    .search-box {
      position: absolute;
      top: 10%;
      left: 24%;
      transform: translate(-50%, -50%);

      height: 50px;
      border-radius: 40px;
      padding: 10px;
      display: flex;
      justify-content: space-between;
    }

    .search-box:hover>.search-txt {
      width: 240px;
      padding: 0 6px;
    }

    .search-box:hover>.search-btn {
      background: white;
      color: black;
    }

    .search-btn {
      color: #eeeeee;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #2f3640;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: 0.4s;
      color: white;
      cursor: pointer;
      text-decoration: none;
    }

    .search-btn>i {
      font-size: 20px;
    }

    .search-txt {
      border: none;
      background: none;
      outline: none;
      padding: 0;
      color: white;
      font-size: 16px;
      transition: 0.4s;
      line-height: 40px;
      width: 0px;
      font-weight: bold;
    }
    }
  </style>
